<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" role="img" aria-label="Palash More: Building resilient, high-throughput systems that drive enterprise operations.">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="fs-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#512BD4" stop-opacity="0"/>
      <stop offset=".25" stop-color="#512BD4"/>
      <stop offset=".5" stop-color="#38BDF8"/>
      <stop offset=".75" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#512BD4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fs-sheen" x1="-300" y1="0" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F0F6FC" stop-opacity="0"/>
      <stop offset=".5" stop-color="#38BDF8" stop-opacity=".7"/>
      <stop offset="1" stop-color="#F0F6FC" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;1500 0;1500 0" keyTimes="0;.4;1" dur="7s" begin="1s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <style>
    .fs-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .fs-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .fs-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .fs-in { animation: fs-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    @keyframes fs-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  </style>
  <rect width="1200" height="140" rx="16" fill="url(#fs-bg)"/>
  <rect x=".5" y=".5" width="1199" height="139" rx="15.5" fill="none" stroke="#30363D" stroke-opacity=".5"/>
  <g class="fs-in" text-anchor="middle">
    <text class="fs-mono" x="600" y="42" font-size="11" letter-spacing="3" fill="#38BDF8">PALASH MORE · SENIOR SOFTWARE DEVELOPER</text>
    <text class="fs-serif" x="600" y="82" font-size="25" font-weight="300" fill="#F0F6FC">Building resilient, high-throughput systems that drive <tspan font-style="italic" fill="#A78BFA">enterprise operations.</tspan></text>
    <rect x="250" y="104" width="700" height="1.5" fill="url(#fs-line)"/>
    <circle cx="250" cy="105" r="3" fill="#38BDF8">
      <animate attributeName="cx" values="250;950;250" dur="8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <animate attributeName="opacity" values=".2;1;.2" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
